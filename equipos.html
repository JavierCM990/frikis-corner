<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div id="navComun"></div>

<div class="container mt-4">
    <h1>Equipos</h1>

    <!-- SELECT EQUIPO -->
    <select id="selectEquipo" class="form-select mb-4">
        <option value="">Selecciona un equipo</option>
    </select>

    <!-- INFO EQUIPO -->
    <div id="infoEquipo"></div>

    <!-- COMPETICIONES -->
    <h4 class="mt-4">Competiciones</h4>
    <ul id="listaCompeticiones"></ul>

    <!-- PARTIDOS -->
    <h4 class="mt-4">Últimos partidos</h4>
    <ul id="listaPartidos"></ul>

    <h4 class="mt-4">Próximo partido</h4>
    <div id="proximoPartido"></div>
</div>

<!-- MODAL PARTIDO -->
<div class="modal fade" id="modalPartido" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Estadísticas del partido</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="contenidoModal"></div>
        </div>
    </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/equipos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
