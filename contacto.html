<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contacto | Frikis del Córner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>

    <!-- NAV -->
    <div id="navComun"></div>

    <!-- FORMULARIO DE CONTACTO -->
    <main class="container py-5 text-center">
        <h1 class="mb-4">Contacto</h1>

        <form id="contactoForm" class="col-md-6 col-lg-4 text-center mx-auto">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="contactEmail" class="form-control" placeholder="Tu email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Asunto</label>
                <input type="text" id="contactAsunto" class="form-control" placeholder="Asunto de la consulta" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mensaje</label>
                <textarea id="contactMensaje" class="form-control" rows="4" placeholder="Escribe tu mensaje"
                    required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Enviar</button>
            <p id="contactResult" class="mt-2"></p>
        </form>

    </main>

    <!-- INSTALACIONES DEPORTIVAS API AYUNTAMIENTO -->
    <section>
        <div class="container text-center py-5">
            <h2 class="mb-4">Campos de fútbol en la Región de Murcia</h2>

            <div class="row contenedorCards g-4"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <div id="footerComun"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/contacto.js"></script>

</body>

</html>
