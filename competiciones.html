<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Competiciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body>
    <div id="navComun"></div>

    <div class="container-fluid mt-4">
        <h1 class="text-center mb-4">Competiciones</h1>

        <!-- FILTROS -->
        <div class="row g-3 mb-4">
            <div class="col-12 col-md-4">
                <label class="form-label">Selecciona Competición</label>
                <select id="selectCompeticion" class="form-select">
                    <option value="">-- Selecciona competición --</option>
                </select>
            </div>

            <div class="col-12 col-md-4">
                <label class="form-label">Filtrar por equipo</label>
                <select id="selectEquipoFiltro" class="form-select">
                    <option value="">Todos los equipos</option>
                </select>
            </div>

            <div class="col-12 col-md-4">
                <label class="form-label">Filtrar por fecha</label>
                <input type="date" id="selectFechaFiltro" class="form-control">
            </div>
        </div>

        <!-- CONTENIDO -->
        <div class="row">
            <!-- CLASIFICACIÓN -->
            <div class="col-12 col-lg-8 mb-4">
                <h3>Clasificación</h3>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered" id="tablaClasificacion"></table>
                </div>
            </div>

            <!-- TOPS -->
            <div class="col-12 col-lg-4 mb-4">
                <h3>Top 3</h3>

                <div class="card mb-3">
                    <div class="card-header bg-success text-white">
                        Más goleadores
                    </div>
                    <ul class="list-group list-group-flush" id="topGoleadores"></ul>
                </div>

                <div class="card">
                    <div class="card-header bg-danger text-white">
                        Menos goleados
                    </div>
                    <ul class="list-group list-group-flush" id="topGoleados"></ul>
                </div>
            </div>
        </div>

        <!-- PARTIDOS -->
        <div class="row">
            <div class="col-12">
                <h3>Partidos</h3>
                <ul id="listaPartidos" class="list-group"></ul>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="modalPartido" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalles del partido</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="contenidoModal"></div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div id="footerComun"></div>

    <script src="../js/app.js"></script>
    <script src="../js/competiciones.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
