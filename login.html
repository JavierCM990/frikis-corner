<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login | Frikis del Córner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- NAV dinámico -->
    <div id="navComun"></div>

    <!-- LOGIN Y REGISTRO -->
    <div class="container mt-5" style="max-width: 420px;">
        <h2 class="text-center mb-4">Iniciar sesión</h2>

        <!-- LOGIN -->
        <form id="loginForm">
            <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Email" required>
            <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Contraseña" required>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <p class="text-center mt-3">
            <a href="#" id="mostrarRegistro">¿Aún no te has registrado?</a>
        </p>

        <!-- REGISTRO -->
        <div id="registroBox" style="display:none;">
            <h4 class="text-center mt-4">Registro</h4>
            <form id="registroForm">
                <input type="text" id="regNombre" class="form-control mb-2" placeholder="Nombre" required>
                <input type="email" id="regEmail" class="form-control mb-2" placeholder="Email" required>
                <input type="password" id="regPassword" class="form-control mb-2" placeholder="Contraseña" required>

                <select id="regEquipo" class="form-select mb-3">
                    <option value="">Equipo favorito (opcional)</option>
                </select>

                <button type="submit" class="btn btn-success w-100">Registrarse</button>
            </form>
        </div>
    </div>

    <div id="footerComun"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/login.js"></script>
</body>

</html>
